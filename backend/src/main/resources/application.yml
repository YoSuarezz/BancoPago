spring:
  application:
    name: bancopago-backend

  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5433/bancopago_db}
    username: ${DB_USER:bancopago}
    password: ${DB_PASSWORD:bancopago_dev_password}
    pool:
      initial-size: 5
      max-size: 20

  flyway:
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5433/bancopago_db}
    user: ${DB_USER:bancopago}
    password: ${DB_PASSWORD:bancopago_dev_password}
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bancopago: DEBUG
    org.springframework.r2dbc: DEBUG